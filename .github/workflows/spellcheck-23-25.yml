name: Spell-check working_set 2025-2023

on:
  push:
    paths:
      - ".github/workflows/spellcheck-23-25.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install codespell
        run: python -m pip install --disable-pip-version-check codespell
      - name: Scan files in requested order
        shell: bash
        run: |
          set +e
          for year in 25 24 23; do
            file="working_set/${year}_redact.md"
            report="working_set/${year}_spellcheck_candidates.txt"
            codespell --quiet-level=2 "$file" > "/tmp/${year}-report.txt" 2>&1
            status=$?
            cp "/tmp/${year}-report.txt" "$report"
            echo "===== ${year}_redact.md | codespell exit status: $status | candidate count: $(wc -l < "/tmp/${year}-report.txt") ====="
            cat "/tmp/${year}-report.txt"
          done
          set -e
      - name: Upload candidate reports
        uses: actions/upload-artifact@v4
        with:
          name: 2025-2023-spellcheck-candidates
          path: working_set/*_spellcheck_candidates.txt
          if-no-files-found: error
