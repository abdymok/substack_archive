name: Extract missing subtitle post text
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-missing-subtitles.yml"
      - "scripts/extract_missing_subtitle_posts.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install openpyxl
      - run: python scripts/extract_missing_subtitle_posts.py
      - uses: actions/upload-artifact@v4
        with:
          name: missing-subtitle-post-text
          path: missing_subtitle_posts.json
          if-no-files-found: error
          retention-days: 7
